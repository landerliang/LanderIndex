<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>飞宫小奇门排盘</title>
    <style>
      :root{--primary:#d8b83f;--primary-soft:#fff6d5;--white:#ffffff;--text:#6b5300;--border:#e5d77a}
      html,body,#app{height:100%;margin:0;font-family:system-ui,Segoe UI,Roboto,'PingFang SC','Hiragino Sans GB',"Microsoft YaHei";background:linear-gradient(180deg,#fffdf2,#ffffff)}
      .container{max-width:900px;margin:18px auto;padding:18px}
      .card{background:var(--white);border-radius:10px;box-shadow:0 6px 18px rgba(216,184,63,0.18);padding:16px;margin-bottom:14px}
      h1{margin:0 0 10px 0;color:var(--primary)}
      .row{display:flex;gap:12px;align-items:center}
      .branches{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
      .slot{min-width:60px;padding:10px 8px;border-radius:8px;background:var(--primary-soft);color:var(--text);text-align:center;cursor:pointer;user-select:none}
      .controls{display:flex;gap:8px;flex-wrap:wrap}
      button{background:var(--primary);color:var(--white);border:none;padding:10px 12px;border-radius:8px;cursor:pointer}
      .btn-ghost{background:transparent;color:var(--primary);border:1px solid rgba(216,184,63,0.35)}
      select{padding:8px;border-radius:6px;border:1px solid rgba(216,184,63,0.35)}
      .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
      .cell{background:var(--primary-soft);padding:12px;border-radius:8px;text-align:center;border:1px solid rgba(216,184,63,0.18);min-height:140px;display:flex;flex-direction:column;justify-content:flex-start;position:relative}
      .cell-title{font-weight:700;margin-bottom:6px}
      .branch-list{font-size:13px;color:#5a4617;text-align:left;white-space:pre-line;line-height:1.45;word-break:break-word;}
      .gate-box{position:absolute;left:12px;bottom:12px;font-size:18px;color:#5a4617;}
      .stem-box{position:absolute;right:12px;bottom:12px;font-size:14px;font-weight:700;color:#6b5300;}
      .mid-stem{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:800;color:#6b5300;}
      .small{font-size:13px;color:#6b5300}
      label.small{display:flex;align-items:center;gap:6px}
      @media (max-width:420px){.slot{min-width:48px;padding:8px}}
    </style>
  </head>
  <body>
    <div id="app">
      <div class="container">
        <div class="card">
          <h1>☯飞宫小奇门排盘</h1>
        </div>

        <div class="card">
          <div class="small">随机地支排盘</div>
		    <div class="small" id="current-datetime">当前：<strong>加载中...</strong></div>
            <div class="small" id="current-pillars">四柱：<strong>加载中...</strong></div>
            <button id="refresh-time" class="btn-ghost">刷新日期时间</button>
          <div style="margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <button id="randomize">随机生成地支</button>
            <label class="small">手动选择地支：
              <select id="branch-select"><option value="">请选择</option></select>
            </label>
            <div class="small" id="selected-branch">当前地支：<strong>未生成</strong></div>
          </div>
        </div>




        <div class="card">
          <div class="small">小奇门排盘结果（固定飞宫小奇门九宫格）</div>
          <div class="grid" id="result-grid"></div>
        </div>

                <div class="card">
                  <div class="small">排盘记录</div>
                  <div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <input id="history-search" placeholder="搜索占断标题" style="padding:6px;border-radius:6px;border:1px solid rgba(216,184,63,0.2);min-width:160px">
                    <button id="clear-history" class="btn-ghost">一键清空</button>
                    <div id="history-pager" style="margin-left:auto;display:flex;gap:8px;align-items:center">
                      <button id="pager-prev" class="btn-ghost">上一页</button>
                      <div id="pager-info" class="small">1/1</div>
                      <button id="pager-next" class="btn-ghost">下一页</button>
                    </div>
                  </div>
                  <div id="history-list" style="margin-top:12px;display:flex;flex-direction:column;gap:8px;min-height:60px;color:#5a4617;"></div>
                </div>
      </div>
    </div>

    <script>
      const TIANGAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
      const DIZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
      const PALACE_NAMES = ['坎一宫','坤二宫','震三宫','巽四宫','中五宫','乾六宫','兑七宫','艮八宫','离九宫'];
      const PALACE_BRANCHES = ['子','未/申','卯','辰/巳','','戌/亥','酉','丑/寅','午'];
      const PALACE_BRANCH_LISTS = PALACE_BRANCHES.map(v => v ? v.split('/') : []);
      const DISPLAY_ORDER = [3,8,1,2,4,6,7,0,5];
      const BRANCH_TO_PALACE = { '子':0, '丑':7, '寅':7, '卯':2, '辰':3, '巳':3, '午':8, '未':1, '申':1, '酉':6, '戌':5, '亥':5 };
      const RING_ORDER = [3,8,1,6,5,0,7,2];
      const REVERSE_BRANCH_PALACES = new Set([3,7]);
      const PALACE_TO_NUMERIC = [1,2,3,4,5,6,7,8,9];
      const NUMERIC_PALACE_MAP = {1:0,2:1,3:2,4:3,5:4,6:5,7:6,8:7,9:8};
      const GATE_ORDER = ['休','生','伤','杜','景','死','惊','开'];
      const BRANCH_ORDER = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
      const YUAN_SHEN_ORDER = ['青龙','明堂','天刑','朱雀','金匮','天德','白虎','玉堂','天牢','玄武','司命','勾陈'];
      const TIAN_XING_ORDER = ['建','除','满','平','定','执','破','危','成','收','开','闭'];
      const STAR_START = {
        '子':'申','午':'申',
        '卯':'寅','酉':'寅',
        '寅':'子','申':'子',
        '巳':'午','亥':'午',
        '丑':'戌','未':'戌',
        '辰':'辰','戌':'辰'
      };
      const FLY_SEQUENCE = [0,1,2,3,4,5,6,7,8,4];
      const DATETIME_API = 'https://worldtimeapi.org/api/timezone/Asia/Shanghai';
      const MONTH_BRANCH_ORDER = ['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];

      function pad(num){ return num.toString().padStart(2,'0'); }
      function toBeijingDate(date){
        const formatter = new Intl.DateTimeFormat('en-US', {
          timeZone: 'Asia/Shanghai',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        const parts = formatter.formatToParts(date);
        const values = {};
        parts.forEach(p => { if(p.type !== 'literal') values[p.type] = p.value; });
        return new Date(Date.UTC(values.year, values.month - 1, values.day, values.hour, values.minute, values.second));
      }
      function cycleIndex(value, offset, modulus){ return ((value - offset) % modulus + modulus) % modulus; }
      // 节气计算：根据年份计算指定节气的公历日期（近似公式，精度±1天，适用于1900-2100年）
      // termIndex: 0=小寒, 2=立春, 4=惊蛰, 6=清明, 8=立夏, 10=芒种, 12=小暑, 14=立秋, 16=白露, 18=寒露, 20=立冬, 22=大雪
      function getJieQiDate(year, termIndex){
        // 二十四节气在1900年的基准日（小数部分为当日时刻偏移）
        const BASE = [
          6.11, 20.92,   // 小寒[0], 大寒[1]
          4.87, 19.53,   // 立春[2], 雨水[3]
          6.63, 21.43,   // 惊蛰[4], 春分[5]
          5.59, 20.88,   // 清明[6], 谷雨[7]
          6.31, 21.86,   // 立夏[8], 小满[9]
          6.35, 22.58,   // 芒种[10], 夏至[11]
          7.75, 23.84,   // 小暑[12], 大暑[13]
          8.49, 23.99,   // 立秋[14], 处暑[15]
          8.44, 23.58,   // 白露[16], 秋分[17]
          8.24, 23.03,   // 寒露[18], 霜降[19]
          7.43, 22.18,   // 立冬[20], 小雪[21]
          7.73, 22.66,   // 大雪[22], 冬至[23]
        ];
        const month = Math.floor(termIndex / 2) + 1; // 节气对应月份
        const offset = 0.2422 * (year - 1900) - Math.floor((year - 1900) / 4);
        const day = Math.floor(BASE[termIndex] + offset);
        return { month, day };
      }

      // 以立春为界确定八字年（立春前属上一年）
      function getBaZiYear(beijingDate){
        const year = beijingDate.getUTCFullYear();
        const month = beijingDate.getUTCMonth() + 1;
        const day = beijingDate.getUTCDate();
        const lichun = getJieQiDate(year, 2);
        if(month < lichun.month || (month === lichun.month && day < lichun.day)){
          return year - 1;
        }
        return year;
      }

      function getYearPillar(date){
        const baziYear = getBaZiYear(date);
        const stem = cycleIndex(baziYear, 4, 10);
        const branch = cycleIndex(baziYear, 4, 12);
        return { pillar: TIANGAN[stem] + DIZHI[branch], stemIndex: stem };
      }

      // 以节气划分月支（十二月建）
      // 月支顺序（从大雪→小寒为子月，小寒→立春为丑月，依此类推）
      function getMonthBranch(date){
        const year = date.getUTCFullYear();
        const month = date.getUTCMonth() + 1;
        const day = date.getUTCDate();
        // 十二月建对应的节气边界：小寒→丑, 立春→寅, 惊蛰→卯, ..., 大雪→子
        const MONTH_BRANCH_FOR_JIE = ['丑','寅','卯','辰','巳','午','未','申','酉','戌','亥','子'];
        // 从后往前找，找到最近一个已过的节气
        for(let i = 11; i >= 0; i--){
          const jie = getJieQiDate(year, i * 2);
          if(month > jie.month || (month === jie.month && day >= jie.day)){
            return MONTH_BRANCH_FOR_JIE[i];
          }
        }
        // 1月初尚未到小寒，仍属上一年的子月
        return '子';
      }

      function getMonthPillar(date, yearStemIndex){
        const branch = getMonthBranch(date);
        const branchIndex = MONTH_BRANCH_ORDER.indexOf(branch);
        const stemIndex = (yearStemIndex * 2 + branchIndex + 2) % 10;
        return TIANGAN[stemIndex] + branch;
      }

      // 日柱：乘五除四法（百度百科"干支换算方法"标准公式）
      // r = (年尾×5 + 年尾÷4取整 + 世纪常数 + 日 + 双月加30 + 月修正数) ÷ 60 取余
      // 干支序号：1=甲子 … 60=癸亥（r=0 对应癸亥，即60）
      // 注意：参数 date 应为已通过 toBeijingDate() 转换的北京时间 Date 对象
      function getDayPillar(date){
        let Y = date.getUTCFullYear();
        let M = date.getUTCMonth() + 1;
        let D = date.getUTCDate();
        const H = date.getUTCHours();

        // 日柱以23:00（初子时）为界，23:00起属次日
        if(H >= 23){
          const nextDay = new Date(Date.UTC(Y, M - 1, D + 1));
          Y = nextDay.getUTCFullYear();
          M = nextDay.getUTCMonth() + 1;
          D = nextDay.getUTCDate();
        }

        // 世纪常数
        const century = Math.floor(Y / 100) * 100;
        let CC;
        if(century === 1800) CC = 25;
        else if(century === 1900) CC = 9;
        else if(century === 2000) CC = 54;
        else if(century === 2100) CC = 39;
        else CC = 0;

        const yearTail = Y % 100;

        // 月修正数表（平年1~12月）：口诀"一二自加闰少一"
        const MONTH_FIX = [1, 2, 0, 1, 1, 2, 2, 3, 4, 4, 5, 5];
        let monthFix = MONTH_FIX[M - 1];

        // 闰年修正："一二自加闰少一" —— 闰年1月、2月修正数各减1
        const isLeap = (Y % 4 === 0 && Y % 100 !== 0) || (Y % 400 === 0);
        if(isLeap && (M === 1 || M === 2)){
          monthFix -= 1;
        }

        // 双月加30
        const evenAdd = (M % 2 === 0) ? 30 : 0;

        let r = yearTail * 5 + Math.floor(yearTail / 4) + CC + D + evenAdd + monthFix;
        r = ((r % 60) + 60) % 60;

        // 干支序号→0-based索引：1=甲子→0 … 60=癸亥→59，r=0→癸亥(59)
        const index0 = (r === 0) ? 59 : (r - 1);
        return { pillar: TIANGAN[index0 % 10] + DIZHI[index0 % 12], stemIndex: index0 % 10 };
      }

      // 时柱：五鼠遁口诀
      // 以23:00（初子时）为一日之始，子时(23-1)、丑时(1-3)、…
      function getHourPillar(date, dayStemIndex){
        let hour = date.getUTCHours();
        // 23:00起属次日的子时，日干已变（由getDayPillar已处理23:00边界）
        // 时支：23点为子时(0)，0点也为子时(0)
        const branchIndex = Math.floor(((hour + 1) % 24) / 2) % 12;
        const stemIndex = (dayStemIndex * 2 + branchIndex) % 10;
        return TIANGAN[stemIndex] + DIZHI[branchIndex];
      }
      function getSexagenaryPillars(date){
        const beijingDate = toBeijingDate(date);
        const year = getYearPillar(beijingDate);
        const month = getMonthPillar(beijingDate, year.stemIndex);
        const day = getDayPillar(beijingDate);
        const hour = getHourPillar(beijingDate, day.stemIndex);
        return { year: year.pillar, month, day: day.pillar, hour };
      }
      function formatDateTime(date){
        const beijingDate = toBeijingDate(date);
        return `${beijingDate.getUTCFullYear()}-${pad(beijingDate.getUTCMonth()+1)}-${pad(beijingDate.getUTCDate())} ${pad(beijingDate.getUTCHours())}:${pad(beijingDate.getUTCMinutes())}:${pad(beijingDate.getUTCSeconds())}`;
      }
      function renderDateTimeAndPillars(date){
        document.getElementById('current-datetime').innerHTML = `时间：<strong>${formatDateTime(date)}</strong>`;
        const p = getSexagenaryPillars(date);
        document.getElementById('current-pillars').innerHTML = `四柱：<strong>${p.year}年 ${p.month}月 ${p.day}日 ${p.hour}时</strong>`;
      }
      async function fetchAndRenderCurrentTime(){
        try {
          const res = await fetch(DATETIME_API);
          const data = await res.json();
          const date = new Date(data.datetime);
          if(isNaN(date)) throw new Error('无效时间');
          renderDateTimeAndPillars(date);
        } catch (e) {
          renderDateTimeAndPillars(new Date());
        }
      }

      ;(function(){
        const randomBtn = document.getElementById('randomize');
        const branchSelect = document.getElementById('branch-select');
        const refreshBtn = document.getElementById('refresh-time');
        const selectedBranchLabel = document.getElementById('selected-branch');
        const grid = document.getElementById('result-grid');
        const historyListEl = document.getElementById('history-list');
        const HISTORY_KEY = 'xiaoqimen_chart_history';
        const MAX_HISTORY = 20;
        const PAGE_SIZE = 5;
        let history = [];
        let currentPage = 1;
        let searchQuery = '';

        function saveHistory(){
          localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }
        function truncateText(s, len){ return s && s.length > len ? s.slice(0,len-1) + '…' : s || ''; }
        function renderHistory(){
          historyListEl.innerHTML = '';
          // prepare indexed, sorted (by datetime desc)
          const indexed = history.map((it, i) => ({ it, i }));
          indexed.sort((a,b) => b.it.datetime.localeCompare(a.it.datetime));
          // apply search filter on title
          const filtered = indexed.filter(x => {
            if(!searchQuery) return true;
            return (x.it.title || '').toLowerCase().indexOf(searchQuery.toLowerCase()) !== -1;
          });
          if(filtered.length === 0){
            historyListEl.textContent = '暂无排盘记录';
            document.getElementById('pager-info').textContent = '0/0';
            return;
          }
          const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
          if(currentPage > totalPages) currentPage = totalPages;
          const start = (currentPage - 1) * PAGE_SIZE;
          const pageItems = filtered.slice(start, start + PAGE_SIZE);
          pageItems.forEach(({it, i})=>{
            const row = document.createElement('div');
            row.style.display = 'flex';
            row.style.gap = '8px';
            row.style.alignItems = 'flex-start';
            row.style.padding = '6px 8px';
            row.style.borderRadius = '6px';
            row.style.background = 'rgba(245,240,220,0.6)';

            const content = document.createElement('div');
            content.style.flex = '1';
            content.style.overflow = 'hidden';

            const titleDiv = document.createElement('div');
            titleDiv.style.fontWeight = '700';
            titleDiv.style.whiteSpace = 'nowrap';
            titleDiv.style.overflow = 'hidden';
            titleDiv.style.textOverflow = 'ellipsis';
            titleDiv.textContent = truncateText(it.title || '', 30) || '(无标题)';
            titleDiv.dataset.historyIndex = i;
            titleDiv.dataset.action = 'open';

            const subDiv = document.createElement('div');
            subDiv.style.fontSize = '12px';
            subDiv.style.color = '#5a4617';
            subDiv.style.whiteSpace = 'nowrap';
            subDiv.style.overflow = 'hidden';
            subDiv.style.textOverflow = 'ellipsis';
            subDiv.textContent = `${it.datetime} · ${it.branch}`;
            subDiv.dataset.historyIndex = i;
            subDiv.dataset.action = 'open';

            content.appendChild(titleDiv);
            content.appendChild(subDiv);

            const restoreBtn = document.createElement('button');
            restoreBtn.textContent = '复原';
            restoreBtn.dataset.historyIndex = i;
            restoreBtn.dataset.action = 'restore';

            const delBtn = document.createElement('button');
            delBtn.textContent = '删除';
            delBtn.style.background = '#fff';
            delBtn.dataset.historyIndex = i;
            delBtn.dataset.action = 'delete';

            row.appendChild(content);
            row.appendChild(restoreBtn);
            row.appendChild(delBtn);
            historyListEl.appendChild(row);
          });
          document.getElementById('pager-info').textContent = `${currentPage}/${totalPages}`;
        }
        function addHistory(branch){
          const now = new Date();
          const item = { branch, datetime: formatDateTime(now), title: '', note: '' };
          history = [item, ...history].slice(0, MAX_HISTORY);
          saveHistory();
          renderHistory();
          currentHistoryIndex = 0;
        }
        function restoreHistory(index){
          const item = history[index];
          if(!item) return;
          branchSelect.value = item.branch;
          selectedBranchLabel.innerHTML = `当前地支：<strong>${item.branch}</strong>`;
          renderGrid(item.branch);
          // show saved judgement if any
          document.getElementById('judgement-title').value = item.title || '';
          document.getElementById('judgement-note').value = item.note || '';
          currentHistoryIndex = index;
        }
        historyListEl.addEventListener('click', (event)=>{
          const idx = event.target.dataset.historyIndex;
          const action = event.target.dataset.action || 'open';
          if(typeof idx !== 'undefined'){
            const i = Number(idx);
            if(action === 'restore' || action === 'open') return restoreHistory(i);
            if(action === 'delete'){
              if(!confirm('确定删除该条记录？')) return;
              history.splice(i,1);
              saveHistory();
              renderHistory();
            }
          }
        });

        const storedHistory = localStorage.getItem(HISTORY_KEY);
        if(storedHistory){
          try { history = JSON.parse(storedHistory) || []; } catch(e){ history = []; }
        }
        let currentHistoryIndex = null;
        renderHistory();

        DIZHI.forEach((branch)=>{
          const option = document.createElement('option');
          option.value = branch;
          option.textContent = branch;
          branchSelect.appendChild(option);
        });

        // judgement inputs under result panel (create elements dynamically)
        const resultCard = document.querySelector('.grid').parentElement;
        const judgementDiv = document.createElement('div');
        judgementDiv.style.marginTop = '12px';
        judgementDiv.innerHTML = `
          <div style="display:flex;flex-direction:column;gap:8px;">
            <label class="small">占断标题<input id="judgement-title" maxlength="30" placeholder="占断标题（最多30字）" style="width:100%;padding:6px;border-radius:6px;border:1px solid rgba(216,184,63,0.2)"></label>
            <label class="small">断语<textarea id="judgement-note" maxlength="500" placeholder="断语（最多500字）" rows="4" style="width:100%;padding:6px;border-radius:6px;border:1px solid rgba(216,184,63,0.2)"></textarea></label>
            <div style="display:flex;gap:8px;">
              <button id="save-judgement">保存占断</button>
              <button id="clear-judgement" class="btn-ghost">清空</button>
            </div>
          </div>`;
        resultCard.appendChild(judgementDiv);

        document.getElementById('save-judgement').addEventListener('click', ()=>{
          const title = document.getElementById('judgement-title').value.trim();
          const note = document.getElementById('judgement-note').value.trim();
          if(title.length > 30) return alert('标题最多30字');
          if(note.length > 500) return alert('断语最多500字');
          if(currentHistoryIndex === null){
            // if no history entry, auto add current branch then attach
            if(!branchSelect.value) return alert('请先选择或生成一个排盘再保存占断');
            addHistory(branchSelect.value);
          }
          history[currentHistoryIndex].title = title;
          history[currentHistoryIndex].note = note;
          saveHistory();
          renderHistory();
          alert('占断已保存到当前排盘记录');
        });
        document.getElementById('clear-judgement').addEventListener('click', ()=>{
          document.getElementById('judgement-title').value = '';
          document.getElementById('judgement-note').value = '';
        });

        // clear all history
        const clearBtn = document.getElementById('clear-history');
        clearBtn.addEventListener('click', ()=>{
          if(!confirm('确定清空所有排盘记录吗？')) return;
          history = [];
          saveHistory();
          renderHistory();
        });

        // search and pager handlers
        const searchInput = document.getElementById('history-search');
        const prevBtn = document.getElementById('pager-prev');
        const nextBtn = document.getElementById('pager-next');
        searchInput.addEventListener('input', ()=>{
          searchQuery = searchInput.value.trim();
          currentPage = 1;
          renderHistory();
        });
        prevBtn.addEventListener('click', ()=>{ if(currentPage>1){ currentPage--; renderHistory(); } });
        nextBtn.addEventListener('click', ()=>{ currentPage++; renderHistory(); });

        function renderGrid(branch){
          grid.innerHTML = '';
          const startPalace = BRANCH_TO_PALACE[branch];

          const palaceTG = new Array(9).fill('');
          const startIndex = FLY_SEQUENCE.indexOf(startPalace);
          for(let i=0;i<10;i++){
            const idx = FLY_SEQUENCE[(startIndex + i) % FLY_SEQUENCE.length];
            palaceTG[idx] = palaceTG[idx] ? palaceTG[idx] + '/' + TIANGAN[i] : TIANGAN[i];
          }

          const palaceGates = new Array(9).fill('-');
          let nextNumeric = PALACE_TO_NUMERIC[startPalace] + 1;
          if(nextNumeric === 5) nextNumeric = 6;
          if(nextNumeric === 10) nextNumeric = 1;
          if(nextNumeric === 5) nextNumeric = 6;
          const startGatePalace = NUMERIC_PALACE_MAP[nextNumeric];
          const startGateIdx = RING_ORDER.indexOf(startGatePalace);
          for(let k=0;k<8;k++){
            const idx = RING_ORDER[(startGateIdx + k) % RING_ORDER.length];
            palaceGates[idx] = GATE_ORDER[k];
          }

          const branchShen = {};
          const branchStar = {};
          const startShenIdx = BRANCH_ORDER.indexOf(branch);
          for(let i=0;i<12;i++){
            const b = BRANCH_ORDER[(startShenIdx + i) % 12];
            branchShen[b] = YUAN_SHEN_ORDER[i];
          }
          const startStarIdx = BRANCH_ORDER.indexOf(STAR_START[branch]);
          for(let i=0;i<12;i++){
            const b = BRANCH_ORDER[(startStarIdx + i) % 12];
            branchStar[b] = TIAN_XING_ORDER[i];
          }

          const palaceYuan = new Array(9).fill('');
          const palaceStar = new Array(9).fill('');
          const palaceBranchDetails = new Array(9).fill(null).map(()=>[]);
          BRANCH_ORDER.forEach((b)=>{
            const p = BRANCH_TO_PALACE[b];
            const shen = branchShen[b];
            const star = branchStar[b];
            palaceYuan[p] = palaceYuan[p] ? palaceYuan[p] + ' ' + shen : shen;
            palaceStar[p] = palaceStar[p] ? palaceStar[p] + ' ' + star : star;
            palaceBranchDetails[p].push(`${b}: ${shen || '-'} ${star || '-'}`);
          });

          DISPLAY_ORDER.forEach((idx)=>{
            const name = PALACE_NAMES[idx];
            const c = document.createElement('div'); c.className='cell';
            const title = document.createElement('div'); title.className='cell-title'; title.textContent = name;
            c.appendChild(title);

            if(idx === 4) {
              const centerStem = document.createElement('div'); centerStem.className='mid-stem';
              centerStem.textContent = palaceTG[idx] ? palaceTG[idx].replace('/','') : '-';
              c.appendChild(centerStem);
            } else {
              const branchLines = document.createElement('div'); branchLines.className='branch-list';
              const branchDetails = palaceBranchDetails[idx].slice();
              if(REVERSE_BRANCH_PALACES.has(idx)) branchDetails.reverse();
              branchLines.textContent = branchDetails.length ? branchDetails.join('\n') : '';
              c.appendChild(branchLines);

              const gateLine = document.createElement('div'); gateLine.className='gate-box'; gateLine.textContent = palaceGates[idx] || '';
              const stemLine = document.createElement('div'); stemLine.className='stem-box'; stemLine.textContent = palaceTG[idx] || '-';
              c.appendChild(gateLine);
              c.appendChild(stemLine);
            }

            grid.appendChild(c);
          });
        }

        branchSelect.addEventListener('change', ()=>{
          const branch = branchSelect.value;
          if(branch) {
            selectedBranchLabel.innerHTML = `当前地支：<strong>${branch}</strong>`;
            renderGrid(branch);
            currentHistoryIndex = null;
          }
        });

        refreshBtn.addEventListener('click', fetchAndRenderCurrentTime);

        function randomizeBranch(){
          const branch = DIZHI[Math.floor(Math.random() * DIZHI.length)];
          branchSelect.value = branch;
          selectedBranchLabel.innerHTML = `当前地支：<strong>${branch}</strong>`;
          renderGrid(branch);
          currentHistoryIndex = null;
        }

        randomBtn.addEventListener('click',randomizeBranch);
        fetchAndRenderCurrentTime();
      })();
    </script>
  </body>
</html>
